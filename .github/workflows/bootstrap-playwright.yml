name: Bootstrap Playwright dependency

on:
  push:
    branches:
      - chore/ci-security-playwright

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: chore/ci-security-playwright
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install Playwright Test and update the npm lockfile
        run: npm install --save-dev --save-exact @playwright/test@1.62.1

      - name: Commit generated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: install Playwright Test [skip ci]"
          git push origin HEAD:chore/ci-security-playwright
